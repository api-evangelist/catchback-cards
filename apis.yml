name: Catchback Cards
description: >-
  Catchback Cards (CatchBack) is a Y Combinator (Winter 2026) company building a mobile and web
  platform for trading card collectors, focused on Pokemon and sports cards. Collectors open digital
  mystery packs to receive physical cards, receive instant buyback offers paid out via Venmo or PayPal,
  and trade cards through a $1 marketplace. The platform differentiates on transparency: it lets
  creators build custom mystery packs with personalized chases and customized odds using
  cryptographically trusted tooling, and publishes open-source verification so collectors can
  independently validate pack randomness and odds. The company launched its iOS app on January 25, 2026
  and is a seven-person team based in San Francisco. Catchback Cards is a consumer application and does
  not currently publish a public API, developer portal, or OpenAPI definition; this profile is
  maintained in the API Evangelist network as a portfolio lead and is enriched only with independently
  verifiable facts.
